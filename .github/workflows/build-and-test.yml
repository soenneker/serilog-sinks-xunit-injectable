name: build-and-test
on:
  # Testing - run for any PRs.
  pull_request:
    branches:
      - main

env:
    DOTNET_NOLOGO: 'true'
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    "PipelineEnvironment": true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        id: test
        run: |
          dotnet test --project test/Serilog.Sinks.XUnit.Injectable.Tests.csproj --verbosity Normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output .
